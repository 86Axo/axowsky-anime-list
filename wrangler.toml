# Cloudflare Pages project. Static site in dist/, API in functions/.
name = "axo86"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Not secrets: the GitHub account allowed to sign in to /admin (numeric id of 86Axo).
[vars]
ADMIN_GITHUB_ID = "177529564"

# D1 database for annotations (created with `wrangler d1 create axo86-annotations`). The id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "axo86-annotations"
database_id = "f3f5818c-cf34-4323-8f72-12af4876aada"
migrations_dir = "migrations"
