name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/import/**'
      - '**.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAKE_ANNOTATIONS: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Builds the site and serves it with wrangler (Pages Functions + local D1).
      - name: End-to-end smoke tests
        run: npm run test:e2e
