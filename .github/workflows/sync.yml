name: Sync anime list

# Daily, on demand, and whenever a new CSV export or an override is pushed.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/import/**'
      - 'data/overrides.json'

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Reads the newest CSV, asks OglądajAnime for my public list once (falls back to
      # the CSV if that is blocked), then fills in MAL data from Jikan through the cache.
      - name: Sync
        run: npm run sync

      # A copy of my notes and hand-added titles, so every change is in the repository history.
      # It never replaces a good copy with an empty or much smaller one.
      - name: Back up my notes
        run: npm run backup

      - name: Unit tests
        run: npm test

      # No change, no commit. A commit is followed by the deploy job below.
      - name: Commit if the data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: sync anime list"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A push made with the built-in token does not start other workflows, so the deploy is called directly.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
