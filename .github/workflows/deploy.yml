name: Deploy

# Builds the site and uploads it to Cloudflare Pages with wrangler.
# Runs on every push to main, on demand, and after a sync that changed the data
# (the sync commits with the built-in token, which does not start push workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed. See the README, section Deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Fails early, with a plain explanation, when the token or the account id is wrong.
      # Only yes/no answers and Cloudflare's own error messages are printed, never a secret.
      - name: Check Cloudflare access
        if: steps.token.outputs.ready == 'true'
        run: |
          api() { curl -sS -m 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character account id (it has ${#CLOUDFLARE_ACCOUNT_ID} characters). Copy the id from 'npx wrangler whoami'."
            exit 1
          fi
          verify=$(api /user/tokens/verify)
          echo "Token check: $(echo "$verify" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          project=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/axo86")
          echo "Project access: $(echo "$project" | jq -c '{success, errors: [.errors[]? | {code, message}]}')"
          if [ "$(echo "$verify" | jq -r .success)" != "true" ]; then
            echo "::error::Cloudflare does not accept CLOUDFLARE_API_TOKEN. Set the secret again with the complete token value."
            exit 1
          fi
          if [ "$(echo "$project" | jq -r .success)" != "true" ]; then
            echo "::error::The token is valid but cannot open the Pages project axo86. It needs the permission Account / Cloudflare Pages / Edit, for the account that owns the project."
            exit 1
          fi

      # Always the newest main, so a deploy started by the sync includes the commit it just pushed.
      - uses: actions/checkout@v7
        if: steps.token.outputs.ready == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v7
        if: steps.token.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.token.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.ready == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.ready == 'true'
        run: npx wrangler pages deploy dist --project-name axo86 --branch main --commit-hash "$(git rev-parse HEAD)" --commit-message "$(git log -1 --pretty=%s)" --commit-dirty=true
